<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador de Senhas</title><link rel="stylesheet" href="styles.min.css"></head><body><div class="container"><h1>Gerador de Senhas</h1><label for="length">Quantidade de caracteres (8 a 16):</label> <input type="number" id="length" value="12" min="8" max="16"><div class="options"><label><input type="checkbox" id="maiusculas"> Incluir Letras Maiúsculas</label> <label><input type="checkbox" id="minusculas"> Incluir Letras Minúsculas</label> <label><input type="checkbox" id="numeros"> Incluir Números</label> <label><input type="checkbox" id="simbolos"> Incluir Caracteres Especiais</label></div><button onclick="gerarSenha()">Gerar Senha</button><div class="output"><input type="text" id="resultado" readonly="readonly" placeholder="Sua senha aparecerá aqui"> <button onclick="copiarSenha()">Copiar</button></div></div><script src="app.min.js"></script></body></html>
